<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расписание студентов</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: white; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Стили таблицы */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #16213e; }
        th, td { border: 1px solid #4e4e4e; padding: 12px; text-align: left; }
        th { background: #0f3460; }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ — скрыта по умолчанию */
        #admin-panel { 
            display: none; 
            background: #e94560; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        
        button { cursor: pointer; padding: 8px 15px; background: #0f3460; color: white; border: none; border-radius: 4px; }
        button:hover { background: #16213e; }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Расписание пар</h1>

    <div id="admin-panel">
        <h3>🛠 Режим учителя (Управление)</h3>
        <button onclick="addLesson()">Добавить пару</button>
        <p><small>* Изменения сохраняются только на этом устройстве (пока не подключим базу данных)</small></p>
    </div>

    <table id="schedule-table">
        <thead>
            <tr>
                <th>Время</th>
                <th>Предмет</th>
                <th>Аудитория</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td contenteditable="false">09:00 - 10:30</td>
                <td contenteditable="false">Высшая математика</td>
                <td contenteditable="false">402</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // 1. ПРОВЕРКА ССЫЛКИ
    const params = new URLSearchParams(window.location.search);
    const isAdmin = params.get('user') === 'teacher';

    if (isAdmin) {
        // Показываем панель
        document.getElementById('admin-panel').style.display = 'block';
        
        // Разрешаем редактировать ячейки таблицы
        const cells = document.querySelectorAll('td');
        cells.forEach(cell => {
            cell.contentEditable = "true";
            cell.style.background = "#1b1b3a"; // подсветим, что можно менять
        });
    }

    // Функция добавления новой строки
    function addLesson() {
        const table = document.getElementById('schedule-table').getElementsByTagName('tbody')[0];
        const newRow = table.insertRow();
        for (let i = 0; i < 3; i++) {
            const cell = newRow.insertCell(i);
            cell.contentEditable = "true";
            cell.innerHTML = "Нажми, чтобы изменить";
        }
    }
</script>

</body>
</html>
